---
name: 'Build Image (staging)'

"on":
  workflow_dispatch: {}

concurrency:
  group: infralive-build-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approval-gate:
    name: Approval gate
    runs-on: ubuntu-latest
    environment: staging-validation
    steps:
      - name: Approval granted
        run: echo "Staging validation approved"

  build-push:
    name: 'Build & Push (ACR)'
    needs: approval-gate
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
      issues: write

    env:
      ACR_NAME: infraliveacr
      ACR_TASK_NAME: acr-task-nginx-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7 

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZ_APPID }}
          tenant-id: ${{ vars.AZ_TENANTID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}

      - name: Run ACR Task
        run: |
          az acr task run \
            --registry "$ACR_NAME" \
            --name "$ACR_TASK_NAME"

      - name: Build Summary
        run: |
          echo "## ACR task completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: $ACR_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Task: $ACR_TASK_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Failure
        if: failure()
        uses: actions/github-script@v8 
        with:
          script: |
            const title = `Staging image build failed: ${context.runId}`;
            const body = `Workflow: ${context.workflow}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-failure']
            });
