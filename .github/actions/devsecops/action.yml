name: DevSecOps check
description: Ejecuta controles de seguridad e IaC


inputs:
  terraform-directory:
    description: Directorio de Terraform
    required: true

runs:
  using: composite


  steps:
    - name: GitLeaks
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Terraform format check
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: terraform fmt -check -recursive

    - name: Trivy IaC scan (informativo)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 
      with:
        version: v0.76.2
        scan-type: config
        scan-ref: ${{ inputs.terraform-directory }}
        format: table
        output: ${{ github.workspace }}/trivy-iac-report.txt
        exit-code: '0'

    - name: Upload Trivy report
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: trivy-iac-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ github.workspace }}/trivy-iac-report.txt
        retention-days: 7
        if-no-files-found: warn

    - name: Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ${{ inputs.terraform-directory }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v6

    - name: Initialize TFLint
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: tflint --init

    - name: Run TFLint
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: tflint --format compact