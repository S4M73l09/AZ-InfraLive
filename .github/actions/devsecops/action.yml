name: DevSecOps check
description: Ejecuta controles de seguridad e IaC


inputs:
  terraform-directory:
    description: Directorio de Terraform
    required: true

runs:
  using: composite


  steps:
    - name: GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Terraform format check
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: terraform fmt -check -recursive

    - name: Trivy IaC scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: config
        scan-ref: ${{ inputs.terraform-directory }}

    - name: Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ${{ inputs.terraform-directory }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v5

    - name: Initialize TFLint
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: tflint --init

    - name: Run TFLint
      shell: bash
      working-directory: ${{ inputs.terraform-directory }}
      run: tflint --format compact